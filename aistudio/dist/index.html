  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap');

    :root {
      --crt-green: #00ff41;
      --crt-green-dim: rgba(0, 255, 65, 0.3);
      --crt-bg: #121212;
    }

    body {
      background-color: #050505;
      color: var(--crt-green);
      font-family: 'IBM Plex Mono', monospace;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }

    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.1) 50%
      ), linear-gradient(
        90deg, 
        rgba(255, 0, 0, 0.03), 
        rgba(0, 255, 0, 0.01), 
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }

    .crt-glow {
      text-shadow: 0 0 5px var(--crt-green);
    }

    .crt-border {
      border: 1px solid var(--crt-green);
      box-shadow: inset 0 0 10px var(--crt-green-dim), 0 0 5px var(--crt-green-dim);
    }

    .knob-focus:focus {
      outline: none;
      box-shadow: 0 0 10px var(--crt-green);
    }
  </style>
