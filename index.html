<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER // Polyphonic MIDI Delay (Preview)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #build-version-label {
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            color: rgba(255,255,255,0.22);
            letter-spacing: 0.04em;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
        }

        /* Power Switch - Canvas Position */
        .power-control-group {
            position: absolute;
            left: 30px;
            top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 100;
        }

        /* Branding - Canvas Position */
        .top-branding {
            position: absolute;
            left: 102px;
            top: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 100;
        }

        /* Right Header Logo SVG - Canvas Position & Constrained Bounds */
        .top-header-right {
            position: absolute;
            right: 30px;
            top: 30px;
            width: 255px;
            height: 90px;
            z-index: 100;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            overflow: hidden;
        }

        .top-header-right .header-logo-right {
            width: 255px !important;
            height: auto !important;
            max-height: 90px !important;
            transform: none !important;
        }

        /* Single-Row Sync Division Lane - Canvas Position */
        .sync-division-lane {
            position: absolute;
            left: 30px;
            top: 170px;
            width: 980px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
        }

        .sync-radio-grid {
            display: flex;
            align-items: stretch;
            height: 36px;
            width: calc(100% - 8px);
            margin: 0 4px;
        }

        .sync-radio-grid > * {
            margin: 0 !important;
            height: 36px !important;
            box-sizing: border-box !important;
            border: 1px solid rgba(0, 255, 65, 0.4) !important;
            border-right: none !important;
            top: auto !important;
        }

        .sync-radio-grid > *:last-child {
            border-right: 1px solid rgba(0, 255, 65, 0.4) !important;
        }

        .sync-radio-grid .sync-radio-btn {
            flex: 1;
        }

        .sync-radio-grid .ms-drag-box {
            background: #121212;
            color: var(--crt-green);
            font-size: 11px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            cursor: ns-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 2;
            transition: all 0.2s ease;
            user-select: none;
        }

        .ms-drag-box:hover {
            background: rgba(0, 255, 65, 0.1);
        }

        .ms-drag-box.active {
            background: var(--crt-green);
            color: black;
            border-color: var(--crt-green);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.6);
        }

        /* Continuous Canvas Workspace (Guarantees 0 Overlaps) */
        .canvas-workspace {
            position: absolute;
            left: 30px;
            top: 250px;
            width: 980px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #lanes-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
    </style>
</head>

        <!-- Single-Row Sync Division Grid -->
        <div class="sync-division-lane">
            <div class="lane-header">
                <span class="lane-title">SYNC DIVISION</span>
            </div>
            <div class="sync-radio-grid">
                <button class="matrix-btn sync-radio-btn" data-div="1/1d">1/1D</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/1">1/1</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/1t">1/1T</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/2d">1/2D</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/2">1/2</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/2t">1/2T</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/4d">1/4D</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/4">1/4</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/4t">1/4T</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/8d">1/8D</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/8">1/8</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/8t">1/8T</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/16d">1/16D</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/16">1/16</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/16t">1/16T</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/32d">1/32D</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/32">1/32</button>
                <button class="matrix-btn sync-radio-btn" data-div="1/32t">1/32T</button>
                <button id="manual-btn" class="matrix-btn sync-radio-btn ms-btn">MS</button>
                <div id="ms-value-box" class="ms-drag-box"><span id="ms-value-text">500</span>ms</div>
            </div>
        </div>

        <!-- Continuous Canvas Workspace (Guarantees 0 Overlaps for All Lower Modules) -->
        <main class="canvas-workspace">
            <!-- 7 Step Lanes Container -->
            <div id="lanes-container"></div>

            <!-- Step Count Lane -->
            <div class="step-count-container">
                <div class="step-count-header">
                    <span id="step-count-label" class="lane-title">STEP COUNT: 15</span>
                </div>
                <div id="step-count-track" class="step-count-track">
                    <!-- 15 segments generated dynamically in app.js -->
                </div>
            </div>

            <!-- Snapshots Container -->
            <div class="snapshot-container">
                <div class="snapshot-header">
                    <span class="lane-title">SNAPSHOT PRESETS</span>
                    <div class="snapshot-actions">
                        <button id="copy-snap-btn" class="action-btn" title="Copy Active Snapshot">C</button>
                        <button id="paste-snap-btn" class="action-btn" title="Paste to Selected Snapshot">P</button>
                        <button id="kill-btn" class="action-btn wide-action-btn" title="Kill ringing delays on stop">KILL ON STOP</button>
                        <button id="kill-on-switch-btn" class="action-btn wide-action-btn" title="Kill ringing delays on snapshot change">KILL ON SWITCH</button>
                    </div>
                </div>
                <div class="snapshot-radio-group">
                    <button class="snapshot-btn active" data-index="0">1</button>
                    <button class="snapshot-btn" data-index="1">2</button>
                    <button class="snapshot-btn" data-index="2">3</button>
                    <button class="snapshot-btn" data-index="3">4</button>
                    <button class="snapshot-btn" data-index="4">5</button>
                    <button class="snapshot-btn" data-index="5">6</button>
                    <button class="snapshot-btn" data-index="6">7</button>
                    <button class="snapshot-btn" data-index="7">8</button>
                    <button class="snapshot-btn" data-index="8">9</button>
                </div>
                <div class="snapshot-edit-group">
                    <button class="snapshot-edit-btn active" data-index="0"></button>
                    <button class="snapshot-edit-btn" data-index="1"></button>
                    <button class="snapshot-edit-btn" data-index="2"></button>
                    <button class="snapshot-edit-btn" data-index="3"></button>
                    <button class="snapshot-edit-btn" data-index="4"></button>
                    <button class="snapshot-edit-btn" data-index="5"></button>
                    <button class="snapshot-edit-btn" data-index="6"></button>
                    <button class="snapshot-edit-btn" data-index="7"></button>
                    <button class="snapshot-edit-btn" data-index="8"></button>
                </div>
            </div>

            <!-- Visualizer Container -->
            <div class="visualizer-container">
                <div class="visualizer-grid" id="visualizer-grid">
                    <!-- Javascript will populate 30 cells (15 cols x 2 rows) -->
                </div>
            </div>
        </main>

        <div id="build-version-label"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
