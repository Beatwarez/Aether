name: Build & Package Aether Plugin

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS VST3 / AU & Installer
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JUCE
        run: |
          git clone --branch 8.0.13 --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Update Jucer Module Paths for CI
        run: |
          python -c '
          import os
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          modules_path = os.path.join(workspace, "JUCE", "modules")
          with open("Aether.jucer", "r") as f:
              text = f.read()
          text = text.replace("C:/JUCE/modules", modules_path)
          text = text.replace("useGlobalPath=\"1\"", "useGlobalPath=\"0\"")
          with open("Aether.jucer", "w") as f:
              f.write(text)
          '

      - name: Download Projucer
        run: |
          curl -L https://github.com/juce-framework/JUCE/releases/download/8.0.13/juce-8.0.13-osx.zip -o juce.zip
          mkdir -p temp_projucer
          unzip -q juce.zip -d temp_projucer
          mv temp_projucer/JUCE/Projucer.app ./Projucer.app
          rm -rf temp_projucer juce.zip

      - name: Generate Xcode Project
        run: |
          ./Projucer.app/Contents/MacOS/Projucer --resave Aether.jucer
          python -c '
          import os, re
          path = "Builds/MacOSX/Aether.xcodeproj/project.pbxproj"
          if os.path.exists(path):
              with open(path, "r") as f:
                  text = f.read()
              pattern = r"(shellScript\s*=\s*\")(?:[^\"]|\\.)*(\";\s*)"
              text = re.sub(pattern, r"\1echo skipped\\n\2", text, flags=re.S)
              with open(path, "w") as f:
                  f.write(text)
              print("Bypassed all post-build shell script phases successfully.")
          '

      - name: Install macOS Certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] && [ -z "$MACOS_INSTALLER_CERTIFICATE" ]; then
            echo "No signing certificates provided. Skipping keychain setup."
            exit 0
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if [ -n "$MACOS_CERTIFICATE" ]; then
            python3 -c "import base64, os; s=os.environ['MACOS_CERTIFICATE'].replace('\r', '').replace('\n', '').replace(' ', ''); s += '=' * (-len(s) % 4); open(os.environ['RUNNER_TEMP'] + '/certificate.p12', 'wb').write(base64.b64decode(s))"
            echo "Certificate size: $(wc -c < $RUNNER_TEMP/certificate.p12) bytes"
            file $RUNNER_TEMP/certificate.p12
            security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          fi

          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            python3 -c "import base64, os; s=os.environ['MACOS_INSTALLER_CERTIFICATE'].replace('\r', '').replace('\n', '').replace(' ', ''); s += '=' * (-len(s) % 4); open(os.environ['RUNNER_TEMP'] + '/installer.p12', 'wb').write(base64.b64decode(s))"
            echo "Installer size: $(wc -c < $RUNNER_TEMP/installer.p12) bytes"
            file $RUNNER_TEMP/installer.p12
            security import $RUNNER_TEMP/installer.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign -T /usr/bin/security
          fi
          
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build VST3 and AU (Universal Binary)
        run: |
          xcodebuild -project Builds/MacOSX/Aether.xcodeproj \
            -scheme "Aether - All" \
            -configuration Release \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Sign VST3 & AU Bundles
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          VST3_PATH=$(find Builds/MacOSX/build -name "Aether.vst3" -type d | head -n 1)
          AU_PATH=$(find Builds/MacOSX/build -name "Aether.component" -type d | head -n 1)
          echo "Found VST3 at: $VST3_PATH"
          echo "Found AU at: $AU_PATH"
          
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "Codesigning plugin bundles..."
            codesign --force --options runtime --timestamp --deep --sign "Developer ID Application:" "$VST3_PATH"
            codesign --force --options runtime --timestamp --deep --sign "Developer ID Application:" "$AU_PATH"
            codesign -vvv --deep --strict "$VST3_PATH"
            codesign -vvv --deep --strict "$AU_PATH"
          else
            echo "Signing certificate not found, skipping final code sign"
          fi

      - name: Notarize Plugins
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VST3_PATH=$(find Builds/MacOSX/build -name "Aether.vst3" -type d | head -n 1)
          AU_PATH=$(find Builds/MacOSX/build -name "Aether.component" -type d | head -n 1)
          
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            echo "Zipping plugins for submission..."
            zip -r "$RUNNER_TEMP/Aether_VST3_to_notarize.zip" "$VST3_PATH"
            zip -r "$RUNNER_TEMP/Aether_AU_to_notarize.zip" "$AU_PATH"
            
            CLEANED_APPLE_ID=$(echo -n "$APPLE_ID" | xargs)
            CLEANED_PASSWORD=$(echo -n "$APPLE_APP_SPECIFIC_PASSWORD" | xargs)
            CLEANED_TEAM_ID=$(echo -n "$APPLE_TEAM_ID" | xargs)
            
            xcrun notarytool submit "$RUNNER_TEMP/Aether_VST3_to_notarize.zip" \
              --apple-id "$CLEANED_APPLE_ID" \
              --password "$CLEANED_PASSWORD" \
              --team-id "$CLEANED_TEAM_ID" \
              --wait
              
            xcrun notarytool submit "$RUNNER_TEMP/Aether_AU_to_notarize.zip" \
              --apple-id "$CLEANED_APPLE_ID" \
              --password "$CLEANED_PASSWORD" \
              --team-id "$CLEANED_TEAM_ID" \
              --wait
            
            xcrun stapler staple "$VST3_PATH"
            xcrun stapler staple "$AU_PATH"
          else
            echo "Missing notarization credentials, skipping notarization"
          fi

      - name: Build macOS Installer Package (VST3 & AU)
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VST3_PATH=$(find Builds/MacOSX/build -name "Aether.vst3" -type d | head -n 1)
          AU_PATH=$(find Builds/MacOSX/build -name "Aether.component" -type d | head -n 1)
          
          # Create installation directories
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3
          mkdir -p pkgroot/Library/Audio/Plug-Ins/Components
          cp -R "$VST3_PATH" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$AU_PATH" pkgroot/Library/Audio/Plug-Ins/Components/
          
          # Build package component
          pkgbuild --root pkgroot \
                   --identifier com.darkInteger.Aether.pkg \
                   --version 1.0.0 \
                   --install-location / \
                   AetherComponent.pkg
          
          # Build final distribution installer
          productbuild --package AetherComponent.pkg Aether_unsigned.pkg
          
          # Sign installer if certificate is provided
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            echo "Signing installer package..."
            productsign --keychain "$KEYCHAIN_PATH" --sign "Developer ID Installer:" Aether_unsigned.pkg Aether_macOS_Installer.pkg
          else
            echo "Installer certificate not found, bypassing package sign step"
            cp Aether_unsigned.pkg Aether_macOS_Installer.pkg
          fi

          # Notarize installer package
          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            echo "Notarizing installer package..."
            CLEANED_APPLE_ID=$(echo -n "$APPLE_ID" | xargs)
            CLEANED_PASSWORD=$(echo -n "$APPLE_APP_SPECIFIC_PASSWORD" | xargs)
            CLEANED_TEAM_ID=$(echo -n "$APPLE_TEAM_ID" | xargs)
            
            xcrun notarytool submit Aether_macOS_Installer.pkg \
              --apple-id "$CLEANED_APPLE_ID" \
              --password "$CLEANED_PASSWORD" \
              --team-id "$CLEANED_TEAM_ID" \
              --wait
            
            xcrun stapler staple Aether_macOS_Installer.pkg
          fi

      - name: Package Raw VST3 & AU
        run: |
          VST3_PATH=$(find Builds/MacOSX/build -name "Aether.vst3" -type d | head -n 1)
          AU_PATH=$(find Builds/MacOSX/build -name "Aether.component" -type d | head -n 1)
          mkdir -p dist/VST3
          mkdir -p dist/AU
          cp -R "$VST3_PATH" dist/VST3/
          cp -R "$AU_PATH" dist/AU/
          zip -r Aether_macOS_Plugins.zip dist/
          
      - name: Clean up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload macOS Plugins
        uses: actions/upload-artifact@v4
        with:
          name: Aether-macOS-Plugins-Raw
          path: Aether_macOS_Plugins.zip
          retention-days: 7

      - name: Upload macOS Installer PKG
        uses: actions/upload-artifact@v4
        with:
          name: Aether-macOS-Installer
          path: Aether_macOS_Installer.pkg
          retention-days: 7

  build-windows:
    name: Build Windows VST3 & Installer
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JUCE
        run: |
          git clone --branch 8.0.13 --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Update Jucer Module Paths for Windows CI
        shell: bash
        run: |
          python -c '
          import os
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          modules_path = os.path.join(workspace, "JUCE", "modules").replace("\\", "/")
          with open("Aether.jucer", "r") as f:
              text = f.read()
          text = text.replace("C:/JUCE/modules", modules_path)
          text = text.replace("useGlobalPath=\"1\"", "useGlobalPath=\"0\"")
          with open("Aether.jucer", "w") as f:
              f.write(text)
          '

      - name: Download Projucer CLI (Windows)
        shell: bash
        run: |
          curl -L https://github.com/juce-framework/JUCE/releases/download/8.0.13/juce-8.0.13-windows.zip -o juce.zip
          mkdir -p temp_projucer
          unzip -q juce.zip -d temp_projucer
          mv temp_projucer/JUCE/Projucer.exe ./Projucer.exe
          rm -rf temp_projucer juce.zip

      - name: Generate Visual Studio Solution
        run: |
          ./Projucer.exe --resave Aether.jucer

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet Packages
        run: |
          nuget restore Builds/VisualStudio2022/Aether.sln

      - name: Build VST3 (x64 Release)
        run: |
          msbuild Builds/VisualStudio2022/Aether.sln /p:Configuration=Release /p:Platform=x64

      - name: Build Installer (Inno Setup)
        run: |
          iscc installer_win.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Windows-Installer
          path: Output/Aether_Windows_Installer.exe
          retention-days: 7
